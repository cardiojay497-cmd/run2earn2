<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Princess Run To Earn</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:Arial;overflow:hidden}
#game{width:100vw;height:100vh;background:linear-gradient(to bottom,#6ec6ff 0%,#c9f0ff 40%,#f0f0f0 40%,#555 41%);position:relative}
#track{position:absolute;bottom:0;width:100%;height:60%;background:repeating-linear-gradient(90deg,#444 0 40px,#666 40px 80px);display:flex}
.lane{flex:1;border-left:3px solid #fff;position:relative}
#princess{position:absolute;bottom:60px;left:15%;width:70px;height:90px;font-size:60px;z-index:10;transition:left 0.2s,bottom 0.2s;text-align:center}
#princess::after{content:"";position:absolute;bottom:-10px;left:20px;width:40px;height:10px;background:rgba(0,0,0,0.3);border-radius:50%}
.obj{position:absolute;bottom:70px;right:-100px;font-size:45px;z-index:5;animation:go 2.5s linear forwards}
.coin{position:absolute;bottom:140px;right:-50px;font-size:30px;z-index:6;animation:go 3s linear forwards}
@keyframes go{to{right:110vw}}
#ui{position:absolute;top:0;width:100%;padding:15px;display:flex;justify-content:space-between;z-index:20;color:#fff;text-shadow:0 2px 4px #000}
#score{font-size:28px;font-weight:bold;background:rgba(0,0,0,0.6);padding:8px 15px;border-radius:20px}
#controls{position:absolute;bottom:20px;width:100%;display:flex;justify-content:center;gap:20px;z-index:20}
.ctrl{width:80px;height:80px;background:rgba(255,255,255,0.9);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 4px 10px #000}
#adBtn{position:absolute;top:70px;right:15px;background:#FFD700;color:#000;padding:10px 15px;border-radius:20px;font-weight:bold;z-index:20}
</style>
</head>
<body>
<div id="game">
<div id="ui"><div id="score">🪙 74</div><div id="lives">❤️❤️❤️</div></div>
<div id="adBtn" onclick="showAd()">📺 +50</div>
<div id="track"><div class="lane"></div><div class="lane"></div><div class="lane"></div></div>
<div id="princess">👸🏃‍♀️</div>
<div id="controls"><div class="ctrl" onclick="move(-1)">◀️</div><div class="ctrl" onclick="jump()">⬆️</div><div class="ctrl" onclick="move(1)">▶️</div></div>
</div>
<script>
let score = parseInt(localStorage.getItem('r2_score')||74);
let lane = 1;
let adCtrl = null;
document.getElementById('score').innerText='🪙 '+score;
function updatePrincess(){const p=document.getElementById('princess');p.style.left=(10+lane*30)+'%';}
function move(dir){lane=Math.max(0,Math.min(2,lane+dir));updatePrincess();}
function jump(){let p=document.getElementById('princess');p.style.bottom='180px';setTimeout(()=>p.style.bottom='60px',400);}
function initAd(){try{adCtrl=window.Adsgram.init({blockId:"int-XXXX",debug:false});}catch(e){}}
function showAd(){if(adCtrl){adCtrl.show().then(()=>{score+=50;save();}).catch(()=>{score+=50;save();});}else{score+=50;save();}}
function save(){localStorage.setItem('r2_score',score);document.getElementById('score').innerText='🪙 '+score;}
setInterval(()=>{
let isCoin=Math.random()>0.4;
let el=document.createElement('div');
el.className=isCoin?'coin':'obj';
el.innerText=isCoin?'🪙':['🚧','🚆','🧱'][Math.floor(Math.random()*3)];
el.style.bottom=(isCoin?140+Math.random()*80:70)+'px';
el.style.right='-50px';
document.getElementById('game').appendChild(el);
el.onclick=()=>{if(isCoin){score+=5;save();el.remove();}}
setTimeout(()=>el.remove(),3500);
},900);
Telegram.WebApp.ready();Telegram.WebApp.expand();initAd();updatePrincess();
</script>
</body>
</html>
